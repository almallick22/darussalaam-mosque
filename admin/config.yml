backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ===== SETTINGS & UPDATES =====
  - name: "settings"
    label: "Site Settings"
    files:
      - file: "data.json"
        label: "Announcement & Updates"
        name: "site-data"
        fields:
          - label: "Announcement Text"
            name: "floatingMessage"
            widget: "string"
            default: "Welcome to Darus Salaam Mosque"
            required: true
            hint: "This message slides across the bottom of every page."

          - label: "Updates"
            name: "updates"
            widget: "list"
            collapsed: false
            label_singular: "Update"
            fields:
              - { label: "Title", name: "title", widget: "string", required: true }
              - { label: "Date", name: "date", widget: "datetime", required: true }
              - { label: "Description", name: "description", widget: "text", required: true }
              - label: "Type"
                name: "type"
                widget: "select"
                options:
                  - { label: "📄 PDF or Image", value: "file" }
                  - { label: "📹 YouTube Video", value: "video" }
                default: "file"
              - { label: "Upload File (PDF or Image)", name: "file", widget: "file", required: false }
              - { label: "YouTube URL", name: "youtubeUrl", widget: "string", required: false }